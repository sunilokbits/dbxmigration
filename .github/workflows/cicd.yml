# =============================================================================
# DBX Migration Studio — CI/CD (GitHub Actions)
# =============================================================================
# pull_request -> main      -> validate only, nothing deployed
# push -> main              -> validate -> deploy to dev (auto)
# workflow_dispatch         -> optionally also deploy to staging (manual opt-in)
# push tag release/*        -> validate -> deploy to every client in
#                              vars.CLIENTS_JSON, each behind its own
#                              GitHub Environment approval gate
#
# Auth model: one Databricks PAT per workspace (dev, staging, one per
# client), stored as an Environment secret. That PAT is the only thing that
# needs to exist up front — deploy/one_click_deploy.py creates everything
# else for a client automatically (Unity Catalog infra, Databricks secret
# scope + secrets, Genie Space, the Databricks App itself).
#
# One-time setup (see githubdoc.html for the full walkthrough):
#   1. Settings > Environments: create "dev", "staging", and one
#      "client-<name>" per client (e.g. "client-insight"). Add
#      DATABRICKS_HOST + DATABRICKS_TOKEN secrets to each; clients also get
#      CLIENT_CONFIG_JSON (+ optional DBX_SOURCE_PASSWORD, AZURE_*). Add a
#      required reviewer on each client-<name> environment for the approval
#      gate.
#   2. Settings > Variables: create CLIENTS_JSON, e.g. ["insight"] — must be
#      a JSON array whose entries each have a matching "client-<name>" env.
# =============================================================================

name: DBX Migration Studio CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["release/*"]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Also deploy to staging after dev"
        type: boolean
        default: false

jobs:
  # ---------------------------------------------------------------------------
  validate:
    name: "01 · Validate bundle & unit tests"
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: databricks bundle validate (all targets)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -e
          databricks bundle validate -t dev
          databricks bundle validate -t staging
          databricks bundle validate -t client --var="client_name=ci-validate"
      - name: Run unit tests
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: pytest migration_utility/tests -v

  # ---------------------------------------------------------------------------
  deploy-dev:
    name: "02 · Deploy to Dev"
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Resolve SQL Warehouse ID
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          WH_ID=$(bash deploy/resolve_sql_warehouse.sh || echo "")
          echo "SQL_WAREHOUSE_ID=$WH_ID" >> "$GITHUB_ENV"
          if [ -n "$WH_ID" ]; then echo "Resolved SQL warehouse: $WH_ID"; else echo "WARN: no SQL warehouse found in this workspace"; fi
      - name: databricks bundle deploy -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          # The CLI's newer "direct" deployment engine has known gaps for the
          # apps resource (confirmed: it starts the app's compute but never
          # creates an actual code Deployment). Force the older, more mature
          # Terraform engine until direct-engine app support stabilizes.
          DATABRICKS_BUNDLE_ENGINE: terraform
        run: |
          set -e
          OUT=$(databricks bundle deploy -t dev --var="sql_warehouse_id=$SQL_WAREHOUSE_ID" 2>&1 | tee /dev/stderr)
          # bundle deploy reconciles the App resource's config but does not
          # itself trigger a code deployment (confirmed: "Resources: ...
          # unchanged" on runs where files were freshly re-uploaded). Extract
          # the workspace path it just uploaded to and deploy that snapshot
          # via the native Apps API command, which -- unlike `bundle run` --
          # doesn't hit the "Must specify environment variable source" bug.
          SRC_PATH=$(echo "$OUT" | grep "Uploading bundle files to" | sed -E 's#.*Uploading bundle files to (.*)\.\.\.#\1#')
          databricks apps deploy dbxmigrationapp --source-code-path "$SRC_PATH" --mode SNAPSHOT
      - name: Scaffold secret scope keys
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -e
          # Every secret key migration_utility/secrets_helper.py actually
          # reads (see _SOURCE_PASSWORD_SECRET_KEYS + get_databricks_token/
          # get_devops_token). databricks-token is refreshed to the deploy's
          # own credential every run (safe -- it's the deploy identity, not
          # client-owned data). Every other key is created with a REPLACE_ME
          # placeholder only if missing (the API rejects a truly empty
          # value on create), never overwriting a value a client already
          # set via the app's Settings page.
          EXISTING=$(databricks secrets list-secrets migration-studio -o json 2>/dev/null | python3 -c "import json,sys; print(' '.join(s['key'] for s in json.load(sys.stdin)))" 2>/dev/null || echo "")
          databricks secrets put-secret migration-studio databricks-token --string-value "$DATABRICKS_TOKEN"
          for key in devops-pat source-sql-password source-azuresql-password source-snowflake-password source-bigquery-password source-redshift-password source-synapse-password source-sharepoint-password source-api-password; do
            if ! echo " $EXISTING " | grep -q " $key "; then
              echo "Scaffolding empty secret: $key"
              databricks secrets put-secret migration-studio "$key" --string-value "REPLACE_ME"
            fi
          done
      - name: Ensure Genie Space exists
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: bash deploy/ensure_genie_space.sh

  # ---------------------------------------------------------------------------
  # Only runs when manually dispatched with deploy_staging=true, so a normal
  # push to main never fails on an unconfigured staging environment.
  deploy-staging:
    name: "03 · Deploy to Staging + integration tests"
    needs: deploy-dev
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_staging == true)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Scaffold secret scope and keys
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -e
          databricks secrets create-scope migration-studio 2>/dev/null || true
          EXISTING=$(databricks secrets list-secrets migration-studio -o json 2>/dev/null | python3 -c "import json,sys; print(' '.join(s['key'] for s in json.load(sys.stdin)))" 2>/dev/null || echo "")
          databricks secrets put-secret migration-studio databricks-token --string-value "$DATABRICKS_TOKEN"
          for key in devops-pat flask-secret-key source-sql-password source-azuresql-password source-snowflake-password source-bigquery-password source-redshift-password source-synapse-password source-sharepoint-password source-api-password; do
            if ! echo " $EXISTING " | grep -q " $key "; then
              databricks secrets put-secret migration-studio "$key" --string-value "REPLACE_ME"
            fi
          done
      - name: Ensure Genie Space exists
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: bash deploy/ensure_genie_space.sh
      - name: Resolve SQL Warehouse ID
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          WH_ID=$(bash deploy/resolve_sql_warehouse.sh || echo "")
          echo "SQL_WAREHOUSE_ID=$WH_ID" >> "$GITHUB_ENV"
          if [ -n "$WH_ID" ]; then echo "Resolved SQL warehouse: $WH_ID"; else echo "WARN: no SQL warehouse found in this workspace"; fi
      - name: databricks bundle deploy -t staging
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -e
          databricks bundle deploy -t staging --select apps.migration_studio --force-lock --var="sql_warehouse_id=$SQL_WAREHOUSE_ID"
          # Start the app compute if stopped, then deploy source code
          databricks apps start dbxmigrationapp --no-wait 2>/dev/null || true
          SRC_PATH=$(databricks bundle validate -t staging -o json 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('workspace',{}).get('file_path',''))" 2>/dev/null || echo "")
          if [ -n "$SRC_PATH" ]; then
            databricks apps deploy dbxmigrationapp --source-code-path "$SRC_PATH" --mode SNAPSHOT --timeout 10m
          fi
      - name: Run integration tests against staging
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          pip install -r requirements.txt
          pytest migration_utility/tests -v -m integration || true

  # ---------------------------------------------------------------------------
  # Depends on "validate" only (NOT deploy-dev/deploy-staging): those only run
  # on a main-branch push, so on a release/* TAG push they never ran in this
  # workflow run. A tag is expected to be cut from a main commit that already
  # went through dev/staging in an earlier, separate run.
  #
  # One matrix job per client in vars.CLIENTS_JSON, each gated by ITS OWN
  # "client-<name>" Environment approval — independent sign-off per client,
  # not one shared gate. deploy/one_click_deploy.py does everything for that
  # client from just its PAT: Unity Catalog infra, secret scope + secrets,
  # Genie Space, the Databricks App itself, app tables, and validation.
  deploy-clients:
    name: "04 · Deploy to ${{ matrix.client }}"
    needs: validate
    if: startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    environment: client-${{ matrix.client }}
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJson(vars.CLIENTS_JSON || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Render client config
        env:
          CLIENT_CONFIG_JSON: ${{ secrets.CLIENT_CONFIG_JSON }}
        run: |
          set -e
          mkdir -p deploy/clients
          printf '%s' "$CLIENT_CONFIG_JSON" > deploy/clients/${{ matrix.client }}.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: One-click deploy to ${{ matrix.client }} (infra + secrets + Genie + app)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBX_SOURCE_PASSWORD: ${{ secrets.DBX_SOURCE_PASSWORD }}
          DBX_DEVOPS_PAT: ${{ secrets.DBX_DEVOPS_PAT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          DATABRICKS_BUNDLE_ENGINE: terraform
        run: |
          set -e
          python deploy/one_click_deploy.py \
            --client-config deploy/clients/${{ matrix.client }}.json \
            --yes
      - name: Upload deploy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-report-${{ matrix.client }}
          path: deploy/reports
