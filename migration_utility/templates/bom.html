<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solution Bill-of-Material (BOM) — SQL → Databricks Migration Accelerator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'DM Sans',system-ui,-apple-system,sans-serif;
  --bg:#F9FAFB;--surface:#FFFFFF;--border:#E5E7EB;--border-2:#D1D5DB;
  --t1:#1B1F2E;--t2:#374151;--t3:#5F6B7A;--t4:#9CA3AF;
  --accent:#6366F1;--accent-light:#EEF2FF;--accent-border:rgba(99,102,241,.2);
  --green:#10B981;--orange:#F59E0B;--red:#EF4444;--blue:#2563EB;
  --radius:16px;--shadow:0 1px 3px rgba(0,0,0,.04);--shadow-md:0 4px 16px rgba(0,0,0,.08);
}
body{font-family:var(--font);background:var(--bg);color:var(--t1);line-height:1.7;font-size:15px}

/* ── HERO ── */
.bom-hero{
  background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 50%,#9333EA 100%);
  padding:60px 40px 50px;color:#fff;position:relative;overflow:hidden;
}
.bom-hero::before{content:'';position:absolute;top:-50%;right:-20%;width:600px;height:600px;border-radius:50%;background:rgba(255,255,255,.04)}
.bom-hero::after{content:'';position:absolute;bottom:-30%;left:-10%;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.03)}
.bom-hero-inner{max-width:1100px;margin:0 auto;position:relative;z-index:1}
.bom-hero h1{font-size:2.2rem;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.bom-hero p{font-size:1.05rem;color:rgba(255,255,255,.75);max-width:700px}
.bom-hero-badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;padding:6px 16px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.9)}
.bom-hero-badge svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}

/* ── NAV ── */
.bom-nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.bom-nav-inner{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:10px 40px;overflow-x:auto}
.bom-nav a{
  padding:8px 16px;border-radius:10px;font-size:12px;font-weight:600;color:var(--t3);
  text-decoration:none;white-space:nowrap;transition:all .2s;border:1px solid transparent;
}
.bom-nav a:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent-border)}
.bom-nav a.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── CONTENT ── */
.bom-body{max-width:1100px;margin:0 auto;padding:32px 40px 80px}

/* ── SECTION CARDS ── */
.bom-section{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:0;margin-bottom:24px;overflow:hidden;box-shadow:var(--shadow);
  transition:all .28s ease;
}
.bom-section:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.bom-section-hd{
  display:flex;align-items:center;gap:14px;padding:24px 28px;cursor:pointer;user-select:none;
  border-bottom:1px solid transparent;transition:all .2s;
}
.bom-section.open .bom-section-hd{border-bottom-color:var(--border)}
.bom-section-num{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;flex-shrink:0;
}
.bom-section-title{flex:1;font-size:1.1rem;font-weight:700;color:var(--t1)}
.bom-section-arrow{width:20px;height:20px;transition:transform .25s ease;color:var(--t4)}
.bom-section.open .bom-section-arrow{transform:rotate(180deg)}
.bom-section-body{
  max-height:0;overflow:hidden;transition:max-height .35s ease;
}
.bom-section.open .bom-section-body{max-height:5000px}
.bom-section-content{padding:24px 28px 28px;color:var(--t2);font-size:14.5px;line-height:1.75}
.bom-section-content h3{font-size:1rem;font-weight:700;color:var(--t1);margin:20px 0 8px}
.bom-section-content h3:first-child{margin-top:0}
.bom-section-content p{margin-bottom:12px}
.bom-section-content ul{padding-left:20px;margin-bottom:12px}
.bom-section-content li{margin-bottom:6px}
.bom-section-content li::marker{color:var(--accent)}

/* ── FEATURE CARDS (inside sections) ── */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:16px 0}
.feat-card{
  padding:20px;border-radius:12px;border:1px solid var(--border);background:var(--bg);
  transition:all .2s;
}
.feat-card:hover{border-color:var(--accent-border);background:var(--accent-light)}
.feat-card-ico{font-size:28px;margin-bottom:10px}
.feat-card h4{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:4px}
.feat-card p{font-size:13px;color:var(--t3);line-height:1.55}

/* ── FLOW DIAGRAM ── */
.flow-steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}
.flow-step{
  padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;color:#fff;
  display:flex;align-items:center;gap:8px;
}
.flow-arrow{font-size:20px;color:var(--t4);flex-shrink:0}

/* ── ARCH TABLE ── */
.arch-table{width:100%;border-collapse:collapse;margin:16px 0;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.arch-table th{background:var(--accent);color:#fff;padding:12px 16px;text-align:left;font-size:13px;font-weight:700}
.arch-table td{padding:12px 16px;font-size:13.5px;border-bottom:1px solid var(--border)}
.arch-table tr:last-child td{border-bottom:none}
.arch-table tr:hover td{background:var(--accent-light)}
.arch-tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.03em}

/* ── CONTACT ── */
.contact-card{
  background:linear-gradient(135deg,#4F46E5,#7C3AED);border-radius:var(--radius);
  padding:40px;color:#fff;text-align:center;margin-top:24px;
}
.contact-card h2{font-size:1.6rem;font-weight:800;margin-bottom:8px}
.contact-card p{color:rgba(255,255,255,.75);margin-bottom:24px;max-width:500px;margin-left:auto;margin-right:auto}
.contact-links{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.contact-link{
  display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:12px;
  font-size:14px;font-weight:600;text-decoration:none;transition:all .2s;
}
.contact-link.primary{background:#fff;color:var(--accent)}
.contact-link.primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.contact-link.secondary{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.contact-link.secondary:hover{background:rgba(255,255,255,.2)}

/* ── PRINT ── */
@media print{.bom-nav{display:none}.bom-section-body{max-height:none!important}.bom-hero{padding:30px 20px}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#F3F4F6}
::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#9CA3AF}
</style>
</head>

{id:'challenge',title:'Customer Challenge',color:'#EF4444',icon:'⚡',content:function(){return `

  <div class="feat-card"><div class="feat-card-ico">📊</div><h4>Schema Design</h4><p>Redesigning relational schemas into Star/Snowflake models optimized for cloud analytics.</p></div>
</div>
<p>The result: <strong>project delays, budget overruns, and inconsistent quality</strong> — often requiring expensive consulting engagements.</p>
`;}},

/* 11 ─ Description of the Accelerator */
{id:'description',title:'Description of the Accelerator',color:'#14B8A6',icon:'📋',content:function(){return `
<p>The SQL → Databricks Migration Accelerator is a <strong>Flask-based web application</strong> that provides a unified, browser-accessible interface for migrating SQL Server workloads to Azure Databricks.</p>
<h3>What It Does</h3>
<ul>
  <li><strong>Discovers</strong> SQL Server objects (Stored Procedures, Views, UDFs) via ODBC/TDS connections</li>
  <li><strong>Converts</strong> T-SQL code to PySpark notebooks using OpenAI / Azure OpenAI</li>
  <li><strong>Deploys</strong> notebooks to Databricks workspaces via Asset Bundles with organized folder structures</li>
  <li><strong>Orchestrates</strong> Databricks Jobs with CRON scheduling, cluster configuration, and run monitoring</li>
  <li><strong>Models</strong> data schemas using Star/Snowflake classification with interactive ER diagrams</li>
  <li><strong>Heals</strong> errors automatically by analyzing exceptions and suggesting targeted fixes</li>
  <li><strong>Explores</strong> Databricks SQL Editor — browse catalogs/schemas/tables, preview data, run SQL queries</li>
</ul>
<h3>Technology Stack</h3>
<ul>
  <li><strong>Backend:</strong> Python 3.11, Flask, pyodbc, Databricks REST API SDK</li>
  <li><strong>Frontend:</strong> Single-page HTML/CSS/JS (no framework dependency)</li>
  <li><strong>Engine:</strong> OpenAI GPT / Azure OpenAI for code conversion and analysis</li>
  <li><strong>Config:</strong> deployconfig.json for secure credential and catalog management</li>
  <li><strong>Deployment:</strong> Databricks Asset Bundles CLI (DABs)</li>
</ul>
`;}},

/* ─── BUILD NAV ─── */
var nav=document.getElementById('bomNav'),body=document.getElementById('bomBody');
sections.forEach(function(s,i){
  var a=document.createElement('a');
  a.href='#'+s.id; a.textContent=s.title; a.dataset.idx=i;
  if(i===0)a.className='active';
  nav.appendChild(a);
});

/* ─── BUILD SECTIONS ─── */
sections.forEach(function(s,i){
  var div=document.createElement('div');
  div.className='bom-section'+(i===0?' open':'');
  div.id=s.id;
  div.innerHTML='<div class="bom-section-hd" onclick="toggleBomSection(this.parentElement)">'+
    '<div class="bom-section-num" style="background:'+s.color+'">'+s.icon+'</div>'+
    '<div class="bom-section-title">'+s.title+'</div>'+
    '<svg class="bom-section-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>'+
    '</div>'+
    '<div class="bom-section-body"><div class="bom-section-content">'+s.content()+'</div></div>';
  body.appendChild(div);
});

/* ─── TOGGLE ─── */
window.toggleBomSection=function(el){
  el.classList.toggle('open');
};

/* ─── NAV SCROLL SPY ─── */
var links=nav.querySelectorAll('a');
window.addEventListener('scroll',function(){
  var from=window.scrollY+120;
  sections.forEach(function(s,i){
    var el=document.getElementById(s.id);
    if(el&&el.offsetTop<=from){
      links.forEach(function(a){a.classList.remove('active');});
      links[i].classList.add('active');
    }
  });
});

/* ─── EXPAND ALL ON LOAD ─── */
document.querySelectorAll('.bom-section').forEach(function(el){ el.classList.add('open'); });

})();
</script>
</body>
</html>
