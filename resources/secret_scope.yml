# Databricks secret scope — Migration Studio
# ==============================================
# Declares the classic workspace-level secret scope the app reads from
# (see migration_utility/secrets_helper.py, DATABRICKS_SECRET_SCOPE env var).
# Terraform CREATES this scope; it does not adopt one that already exists. If
# the scope was made outside this bundle (earlier deploy, one_click_deploy.py,
# or secrets_helper creating it on demand) the deploy fails with "Scope
# migration-studio already exists" until it is bound into state -- the CI
# "Adopt pre-existing secret scope" step runs `bundle deployment bind` for
# exactly that reason.
#
# NOT declared here: the actual secret VALUES (token, source DB password,
# Flask key, etc). Databricks intentionally has no way to set a literal
# value on a classic secret-scope entry from bundle config — that's by
# design, so nothing sensitive ever sits in version control. Clients set
# these themselves through the app's own Settings page after deploy
# (routes/settings.py already calls secrets_helper.set_secret(), which
# creates this same scope on demand if it's somehow still missing).

resources:
  secret_scopes:
    migration_studio_secrets:
      name: migration-studio
      permissions:
        - level: READ
          group_name: users
