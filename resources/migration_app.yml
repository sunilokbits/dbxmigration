# Databricks App resource — Migration Studio
# ============================================
# Deploys the Flask app as a Databricks Native App (App Spaces).

resources:
  apps:
    migration_studio:
      name: "dbxmigrationapp"
      description: "SQL to Databricks Migration Studio — end-to-end migration orchestration platform"
      source_code_path: .
      config:
        command:
          - gunicorn
          - "--bind=0.0.0.0:8000"
          - "--workers=2"
          - "--threads=8"
          - "--timeout=180"
          - "--chdir=/app/migration_utility"
          - "app:app"
        env:
          - name: DATABRICKS_SQL_WAREHOUSE_ID
            value: ${var.sql_warehouse_id}
          - name: DATABRICKS_CATALOG
            value: ${var.catalog_admin}
          - name: DATABRICKS_SCHEMA
            value: ${var.app_schema}
          - name: DATABRICKS_SECRET_SCOPE
            value: migration-studio
          - name: CLOUD_PROVIDER
            value: ${var.cloud_provider}
          - name: FLASK_SECRET_KEY
            value: ${var.flask_secret_key}
          - name: GENIE_SPACE_ID
            value: ${var.genie_space_id}
      resources:
        - name: secret-databricks-token
          secret:
            scope: migration-studio
            key: databricks-token
            permission: READ
        - name: secret-source-sql-password
          secret:
            scope: migration-studio
            key: source-sql-password
            permission: READ
        - name: secret-source-azuresql-password
          secret:
            scope: migration-studio
            key: source-azuresql-password
            permission: READ
        - name: secret-source-snowflake-password
          secret:
            scope: migration-studio
            key: source-snowflake-password
            permission: READ
        - name: secret-source-redshift-password
          secret:
            scope: migration-studio
            key: source-redshift-password
            permission: READ
        - name: secret-source-synapse-password
          secret:
            scope: migration-studio
            key: source-synapse-password
            permission: READ
        - name: secret-source-bigquery-password
          secret:
            scope: migration-studio
            key: source-bigquery-password
            permission: READ
        - name: secret-source-sharepoint-password
          secret:
            scope: migration-studio
            key: source-sharepoint-password
            permission: READ
        - name: secret-source-api-password
          secret:
            scope: migration-studio
            key: source-api-password
            permission: READ
        - name: secret-devops-pat
          secret:
            scope: migration-studio
            key: devops-pat
            permission: READ
        - name: secret-flask-secret-key
          secret:
            scope: migration-studio
            key: flask-secret-key
            permission: READ
      permissions:
        - level: CAN_USE
          group_name: users
