# =============================================================================
# DBX Migration Studio — CI/CD pipeline (Azure DevOps)
# =============================================================================
# feature/* -> PR (validate)              -> nothing deployed
# main      -> merge                      -> auto-deploy: dev
# main      -> after dev succeeds         -> staging (only if deployStaging=true; off by default
#                                             until kv-staging is configured with real values)
# release/* -> tag pushed                 -> manual approval -> deploy to every client workspace
#
# Run with deployStaging=true (Pipelines > Run pipeline > parameters) once
# kv-staging has real DATABRICKS_HOST/DATABRICKS_TOKEN values.
#
# Auth model: a Databricks PAT per workspace (dev, staging, and one per
# client), stored as a secret variable in that target's Azure DevOps variable
# group. That PAT is the only thing that must exist before the pipeline can
# reach a workspace for the first time — everything downstream of it
# (Unity Catalog infra, secret scope + secrets, Genie Space, the Databricks
# App itself) is created automatically by deploy/one_click_deploy.py.
#
# Setup required once, in Azure DevOps (see deploy/pipeline/README.md):
#   1. Variable groups: kv-dev, kv-staging, kv-<clientName> (one per client),
#      each holding that workspace's DATABRICKS_HOST + DATABRICKS_TOKEN (PAT)
#      as secret variables, plus (for clients) CLIENT_CONFIG_JSON and any
#      optional secrets the one-click deploy needs.
#   2. Environments: dev, staging, clients-prod (clients-prod has the manual
#      approval check — the single gate protecting every client deploy).
#   3. Update the `clients` parameter below with onboarded client names.
# =============================================================================

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - release/*

pr:
  branches:
    include:
      - main

parameters:
  - name: clients
    displayName: Client workspaces to deploy (production)
    type: object
    # Empty until a client has a real kv-<name> variable group — Azure DevOps
    # validates every kv-<client> group referenced here exists BEFORE running,
    # even for stages that end up skipped, so an unconfigured client here
    # would fail the whole pipeline before Validate/DeployDev even start.
    default: []
  - name: deployStaging
    displayName: Deploy to Staging (requires kv-staging to be configured)
    type: boolean
    default: false

variables:
  - name: pythonVersion
    value: "3.11"
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  - name: isReleaseTag
    value: $[startsWith(variables['Build.SourceBranch'], 'refs/tags/release/')]

stages:
  # ---------------------------------------------------------------------------
  - stage: Validate
    displayName: "01 · Validate bundle & unit tests"
    variables:
      - group: kv-dev
    jobs:
      - job: Validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - bash: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: Install Databricks CLI

          - bash: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install pytest
            displayName: Install Python dependencies

          - bash: |
              set -e
              databricks bundle validate -t dev
              databricks bundle validate -t staging
              databricks bundle validate -t client --var="client_name=ci-validate"
            displayName: databricks bundle validate (all targets)
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

          - bash: |
              pytest migration_utility/tests -v
            displayName: Run unit tests
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

  # ---------------------------------------------------------------------------
  - stage: DeployDev
    displayName: "02 · Deploy to Dev"
    dependsOn: Validate
    condition: and(succeeded(), eq(variables.isMain, 'true'))
    jobs:
      - job: DeployDev
        pool:
          vmImage: ubuntu-latest
        variables:
          - group: kv-dev
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - bash: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: Install Databricks CLI
          - bash: |
              set -e
              curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
            displayName: Install Terraform
          - bash: |
              set -e
              OUT=$(databricks bundle deploy -t dev 2>&1 | tee /dev/stderr)
              # bundle deploy reconciles the App resource's config but does not
              # itself trigger a code deployment (confirmed: "Resources: ...
              # unchanged" on runs where files were freshly re-uploaded).
              # Extract the workspace path it just uploaded to and deploy that
              # snapshot via the native Apps API command, which -- unlike
              # `bundle run` -- doesn't hit the "Must specify environment
              # variable source" bug.
              SRC_PATH=$(echo "$OUT" | grep "Uploading bundle files to" | sed -E 's#.*Uploading bundle files to (.*)\.\.\.#\1#')
              databricks apps deploy dbxmigrationapp --source-code-path "$SRC_PATH" --mode SNAPSHOT
            displayName: databricks bundle deploy -t dev
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
              # The CLI's newer "direct" deployment engine has known gaps for
              # the apps resource (confirmed: it starts the app's compute but
              # never creates an actual code Deployment). Force the older,
              # more mature Terraform engine until direct-engine app support
              # stabilizes.
              DATABRICKS_BUNDLE_ENGINE: terraform

  # ---------------------------------------------------------------------------
  - stage: DeployStaging
    displayName: "03 · Deploy to Staging + integration tests"
    dependsOn: DeployDev
    condition: and(succeeded(), eq('${{ parameters.deployStaging }}', 'true'))
    jobs:
      - job: DeployStaging
        pool:
          vmImage: ubuntu-latest
        variables:
          - group: kv-staging
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - bash: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: Install Databricks CLI
          - bash: |
              set -e
              curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
            displayName: Install Terraform
          - bash: |
              set -e
              databricks bundle deploy -t staging
            displayName: databricks bundle deploy -t staging
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
              DATABRICKS_BUNDLE_ENGINE: terraform
          - bash: |
              pip install -r requirements.txt
              pytest migration_utility/tests -v -m integration || true
            displayName: Run integration tests against staging
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

  # ---------------------------------------------------------------------------
  # One job per client, fully in parallel, each gated by the same manual
  # approval on the "clients-prod" Environment. Only fires on a release/* tag.
  #
  # deploy/one_click_deploy.py does EVERYTHING for a client from just its PAT:
  #   - creates/reuses the Unity Catalog infra (catalogs, volumes, storage)
  #   - creates the "migration-studio" secret scope and writes every secret
  #     into it (source DB password, per-client Flask key, DevOps PAT, ...)
  #   - resolves or auto-creates the client's Genie Space
  #   - runs `databricks bundle deploy -t client` which creates/updates the
  #     Databricks App itself
  #   - initializes app tables and validates the whole deploy
  #
  # Compile-time guarded: with an empty `clients` list this stage is omitted
  # entirely (a stage with zero jobs is a hard YAML error, not just "skipped").
  - ${{ if gt(length(parameters.clients), 0) }}:
    - stage: DeployClients
      displayName: "04 · Deploy to client production workspaces"
      # Depends on Validate only, NOT DeployDev/DeployStaging: those stages
      # are gated to run on main-branch pushes, so on a release/* TAG push
      # they're skipped in this same run, and a dependsOn chain through them
      # would make this stage skip too (a skipped dependency never
      # "succeeds"). A tag is expected to be cut from a main commit that
      # already went through dev/staging in an earlier, separate run.
      dependsOn: Validate
      condition: and(succeeded(), eq(variables.isReleaseTag, 'true'))
      jobs:
        - ${{ each client in parameters.clients }}:
            - deployment: Deploy_${{ replace(client, '-', '_') }}
              displayName: "Deploy to ${{ client }}"
              pool:
                vmImage: ubuntu-latest
              environment: clients-prod
              variables:
                - group: kv-${{ client }}
              strategy:
                runOnce:
                  deploy:
                    steps:
                      - checkout: self
                      - task: UsePythonVersion@0
                        inputs:
                          versionSpec: $(pythonVersion)
                      - bash: |
                          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
                        displayName: Install Databricks CLI
                      - bash: |
                          set -e
                          curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
                          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
                        displayName: Install Terraform
                      - bash: |
                          set -e
                          mkdir -p deploy/clients
                          # CLIENT_CONFIG_JSON is the filled-in client.template.json
                          # (non-secret values) stored as a variable in kv-${{ client }}.
                          printf '%s' "$(CLIENT_CONFIG_JSON)" > deploy/clients/${{ client }}.json
                        displayName: Render client config
                      - bash: |
                          python -m pip install --upgrade pip
                          pip install -r requirements.txt
                        displayName: Install Python dependencies
                      - bash: |
                          set -e
                          python deploy/one_click_deploy.py \
                            --client-config deploy/clients/${{ client }}.json \
                            --yes
                        displayName: One-click deploy to ${{ client }} (infra + secrets + Genie + app)
                        env:
                          DATABRICKS_HOST: $(DATABRICKS_HOST)
                          DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
                          DBX_SOURCE_PASSWORD: $(DBX_SOURCE_PASSWORD)
                          DBX_DEVOPS_PAT: $(DBX_DEVOPS_PAT)
                          AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
                          AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
                          AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                          DATABRICKS_BUNDLE_ENGINE: terraform
                      - publish: deploy/reports
                        artifact: deploy-report-${{ client }}
                        condition: always()
