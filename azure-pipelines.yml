# =============================================================================
# DBX Migration Studio — CI/CD pipeline (Azure DevOps)
# =============================================================================
# feature/* -> PR (validate)              -> nothing deployed
# main      -> merge                      -> auto-deploy: dev
# main      -> after dev succeeds         -> auto-deploy: staging + integration tests
# release/* -> tag pushed                 -> manual approval -> deploy to every client workspace
#
# Auth model: a Databricks PAT per workspace (dev, staging, and one per
# client), stored as a secret variable in that target's Azure DevOps variable
# group. That PAT is the only thing that must exist before the pipeline can
# reach a workspace for the first time — everything downstream of it
# (Unity Catalog infra, secret scope + secrets, Genie Space, the Databricks
# App itself) is created automatically by deploy/one_click_deploy.py.
#
# Setup required once, in Azure DevOps (see deploy/pipeline/README.md):
#   1. Variable groups: kv-dev, kv-staging, kv-<clientName> (one per client),
#      each holding that workspace's DATABRICKS_HOST + DATABRICKS_TOKEN (PAT)
#      as secret variables, plus (for clients) CLIENT_CONFIG_JSON and any
#      optional secrets the one-click deploy needs.
#   2. Environments: dev, staging, clients-prod (clients-prod has the manual
#      approval check — the single gate protecting every client deploy).
#   3. Update the `clients` parameter below with onboarded client names.
# =============================================================================

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - release/*

pr:
  branches:
    include:
      - main

parameters:
  - name: clients
    displayName: Client workspaces to deploy (production)
    type: object
    default:
      - insight
      - test-client

variables:
  - name: pythonVersion
    value: "3.11"
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  - name: isReleaseTag
    value: $[startsWith(variables['Build.SourceBranch'], 'refs/tags/release/')]

stages:
  # ---------------------------------------------------------------------------
  - stage: Validate
    displayName: "01 · Validate bundle & unit tests"
    variables:
      - group: kv-dev
    jobs:
      - job: Validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - bash: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: Install Databricks CLI

          - bash: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install pytest
            displayName: Install Python dependencies

          - bash: |
              set -e
              databricks bundle validate -t dev
              databricks bundle validate -t staging
              databricks bundle validate -t client --var="client_name=ci-validate"
            displayName: databricks bundle validate (all targets)
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

          - bash: |
              pytest migration_utility/tests -v
            displayName: Run unit tests

  # ---------------------------------------------------------------------------
  - stage: DeployDev
    displayName: "02 · Deploy to Dev"
    dependsOn: Validate
    condition: and(succeeded(), eq(variables.isMain, 'true'))
    jobs:
      - job: DeployDev
        pool:
          vmImage: ubuntu-latest
        variables:
          - group: kv-dev
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - bash: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: Install Databricks CLI
          - bash: |
              set -e
              databricks bundle deploy -t dev
              databricks bundle run -t dev sql_to_databricks_migration_app || true
            displayName: databricks bundle deploy -t dev
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

  # ---------------------------------------------------------------------------
  - stage: DeployStaging
    displayName: "03 · Deploy to Staging + integration tests"
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - job: DeployStaging
        pool:
          vmImage: ubuntu-latest
        variables:
          - group: kv-staging
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - bash: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: Install Databricks CLI
          - bash: |
              set -e
              databricks bundle deploy -t staging
            displayName: databricks bundle deploy -t staging
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
          - bash: |
              pip install -r requirements.txt
              pytest migration_utility/tests -v -m integration || true
            displayName: Run integration tests against staging
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

  # ---------------------------------------------------------------------------
  # One job per client, fully in parallel, each gated by the same manual
  # approval on the "clients-prod" Environment. Only fires on a release/* tag.
  #
  # deploy/one_click_deploy.py does EVERYTHING for a client from just its PAT:
  #   - creates/reuses the Unity Catalog infra (catalogs, volumes, storage)
  #   - creates the "migration-studio" secret scope and writes every secret
  #     into it (source DB password, per-client Flask key, DevOps PAT, ...)
  #   - resolves or auto-creates the client's Genie Space
  #   - runs `databricks bundle deploy -t client` which creates/updates the
  #     Databricks App itself
  #   - initializes app tables and validates the whole deploy
  - stage: DeployClients
    displayName: "04 · Deploy to client production workspaces"
    dependsOn: DeployStaging
    condition: and(succeeded(), eq(variables.isReleaseTag, 'true'))
    jobs:
      - ${{ each client in parameters.clients }}:
          - deployment: Deploy_${{ replace(client, '-', '_') }}
            displayName: "Deploy to ${{ client }}"
            pool:
              vmImage: ubuntu-latest
            environment: clients-prod
            variables:
              - group: kv-${{ client }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - task: UsePythonVersion@0
                      inputs:
                        versionSpec: $(pythonVersion)
                    - bash: |
                        curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
                      displayName: Install Databricks CLI
                    - bash: |
                        set -e
                        mkdir -p deploy/clients
                        # CLIENT_CONFIG_JSON is the filled-in client.template.json
                        # (non-secret values) stored as a variable in kv-${{ client }}.
                        printf '%s' "$(CLIENT_CONFIG_JSON)" > deploy/clients/${{ client }}.json
                      displayName: Render client config
                    - bash: |
                        python -m pip install --upgrade pip
                        pip install -r requirements.txt
                      displayName: Install Python dependencies
                    - bash: |
                        set -e
                        python deploy/one_click_deploy.py \
                          --client-config deploy/clients/${{ client }}.json \
                          --yes
                      displayName: One-click deploy to ${{ client }} (infra + secrets + Genie + app)
                      env:
                        DATABRICKS_HOST: $(DATABRICKS_HOST)
                        DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
                        DBX_SOURCE_PASSWORD: $(DBX_SOURCE_PASSWORD)
                        DBX_DEVOPS_PAT: $(DBX_DEVOPS_PAT)
                        AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
                        AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
                        AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                    - publish: deploy/reports
                      artifact: deploy-report-${{ client }}
                      condition: always()
