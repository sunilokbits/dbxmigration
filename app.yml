command:
  - gunicorn
  - --bind=0.0.0.0:8000
  - --workers=2
  - --threads=8
  - --timeout=180
  - --chdir=migration_utility
  - app:app

resources:
  - name: fm-endpoint
    serving_endpoint:
      name: "databricks-claude-opus-4-8"
      permission: CAN_QUERY
  - name: fm-endpoint-sonnet
    serving_endpoint:
      name: "databricks-claude-sonnet-5"
      permission: CAN_QUERY
  - name: fm-endpoint-haiku
    serving_endpoint:
      name: "databricks-claude-haiku-4-5"
      permission: CAN_QUERY

env:
  - name: DATABRICKS_CATALOG
    value: "admin_source"

  - name: DATABRICKS_SCHEMA
    value: "migration_app"

  - name: DATABRICKS_SECRET_SCOPE
    value: "migration-studio"

  - name: CLOUD_PROVIDER
    value: "azure"

  - name: FLASK_SECRET_KEY
    value: "dbx-migration-studio-secret-key-2026"

  # DATABRICKS_HOST/DATABRICKS_SERVER_HOSTNAME are intentionally NOT set here.
  # Databricks Apps auto-injects DATABRICKS_HOST for whatever workspace the
  # app actually runs in; hardcoding it here previously pointed every
  # deployment (dev/staging/every client) at one fixed workspace regardless
  # of where it was actually deployed, causing the app to try connecting
  # cross-workspace and hang in an OAuth flow that can never complete.
  #
  # DATABRICKS_SQL_WAREHOUSE_ID / DATABRICKS_HTTP_PATH are also intentionally
  # NOT hardcoded here for the same reason (the ID here belonged to a
  # different workspace) -- set per-environment via the bundle's
  # resources/migration_app.yml (${var.sql_warehouse_id}) instead.

  - name: RUNNING_ON_DBX_APPS
    value: "true"

  - name: GENIE_SPACE_ID
    value: ""

  - name: CATALOG_CACHE_TTL
    value: "300"

  - name: MAX_TABLES_PER_SCHEMA
    value: "500"
